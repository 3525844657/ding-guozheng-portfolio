<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="暗色科技感首屏背景占位图">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020202"/>
      <stop offset="0.55" stop-color="#050708"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="47%" r="42%">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0.085"/>
      <stop offset="0.45" stop-color="#00f0ff" stop-opacity="0.018"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#00f0ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="84" height="84" patternUnits="userSpaceOnUse">
      <path d="M84 0H0V84" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
